name: Verificación de AulaVirtualJv

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  revisar:
    name: Comprobar código y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Validar sintaxis
        run: npm run check
      - name: Ejecutar pruebas
        run: npm test
