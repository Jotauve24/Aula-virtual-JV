    <text x="70" y="161" fill="#FFFFFF" font-size="52" font-weight="900" letter-spacing="-1.5">Tu aula.</text><text x="70" y="216" fill="#FF847C" font-family="Georgia,serif" font-size="55" font-style="italic">Tu equipo.</text><rect x="70" y="228" width="229" height="5" rx="2.5" fill="#E84A5F"/><text x="70" y="274" fill="#F4E9CD" font-size="20" font-weight="700">Avatares · equipos · chat privado</text>
