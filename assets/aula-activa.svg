<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">AulaVirtualJv — tu aula, tu equipo</title>
  <desc id="desc">Una miniatura animada del aula interactiva con cuatro equipos, avatares, un pasillo central y chat privado.</desc>
  <defs><clipPath id="frame"><rect width="1280" height="360" rx="30"/></clipPath><clipPath id="map"><rect x="735" y="33" width="465" height="294" rx="20"/></clipPath></defs>
  <style>
    .walker{animation:walk 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.step{animation:step .55s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}.chat{animation:chat 5.2s ease-in-out infinite;transform-box:fill-box;transform-origin:left bottom}.online{animation:online 2.4s ease-in-out infinite}
    @keyframes walk{0%,10%{transform:translate(-42px,62px)}40%{transform:translate(12px,6px)}55%{transform:translate(12px,6px)}88%,100%{transform:translate(68px,-52px)}}@keyframes step{to{transform:translateY(-3px)}}@keyframes chat{0%,56%,100%{opacity:0;transform:scale(.88) translateY(5px)}64%,91%{opacity:1;transform:scale(1) translateY(0)}}@keyframes online{0%,100%{opacity:.55}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.walker,.step,.chat,.online{animation:none}.chat{opacity:1}}
  </style>
  <g clip-path="url(#frame)"><rect width="1280" height="360" fill="#031926"/><rect y="310" width="1280" height="50" fill="#468189"/><path d="M0 318C214 282 395 346 614 314C817 284 1020 339 1280 302V360H0Z" fill="#77ACA2" opacity=".34"/></g>
