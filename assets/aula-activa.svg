<svg xmlns="http://www.w3.org/2000/svg" width="560" height="86" viewBox="0 0 560 86" role="img" aria-labelledby="title desc">
  <title id="title">AulaVirtualJv — proyecto público activo</title>
  <desc id="desc">Etiqueta en tonos verde azulado, crema y coral con una animación suave.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#031926"/><stop offset="0.58" stop-color="#2A363B"/><stop offset="1" stop-color="#468189"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4E9CD" stop-opacity="0"/><stop offset="0.5" stop-color="#F4E9CD" stop-opacity="0.28"/><stop offset="1" stop-color="#F4E9CD" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="pill"><rect x="1" y="1" width="558" height="84" rx="24"/></clipPath>
  </defs>
  <style>.pulse{animation:pulse 2.8s ease-in-out infinite;transform-origin:44px 43px}.sweep{animation:sweep 4.8s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(.82);opacity:.62}50%{transform:scale(1.16);opacity:1}}@keyframes sweep{0%,18%{transform:translateX(-170px)}72%,100%{transform:translateX(650px)}}@media (prefers-reduced-motion:reduce){.pulse,.sweep{animation:none}}</style>
  <rect x="1" y="1" width="558" height="84" rx="24" fill="url(#bg)" stroke="#77ACA2" stroke-width="2"/>
  <g clip-path="url(#pill)"><rect class="sweep" x="-130" y="-18" width="100" height="126" fill="url(#shine)" transform="skewX(-18)"/></g>
  <circle class="pulse" cx="44" cy="43" r="17" fill="#FF847C" opacity=".42" filter="url(#glow)"/><circle cx="44" cy="43" r="8" fill="#FECEA8"/><path d="M40 43.2l2.8 2.8 6-7" fill="none" stroke="#031926" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="76" y="36" fill="#F4E9CD" font-family="Arial,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2.3">AULAVIRTUALJV</text><text x="76" y="60" fill="#FFFFFF" font-family="Arial,Segoe UI,sans-serif" font-size="20" font-weight="700">Proyecto público activo</text>
  <rect x="449" y="27" width="82" height="32" rx="16" fill="#99B898"/><text x="490" y="48" text-anchor="middle" fill="#031926" font-family="Arial,Segoe UI,sans-serif" font-size="12" font-weight="800">EN LÍNEA</text>
</svg>
